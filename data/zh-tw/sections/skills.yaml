skills:
- name: Python 與資料分析
  summary: "以 NumPy、Pandas、SciPy、scikit-learn、PyTorch、PyMC 與 statsmodels 建立可重現的資料整理、分析與建模流程。"
  categories: ["programming"]
- name: 自然語言處理
  summary: "建立詞彙、TF-IDF、情境式 embedding、主題、語法與序列表徵；分析語意相似度、語意軌跡與對話對齊。"
  categories: ["language", "research"]
- name: 時間與序列分析
  summary: "分析對話輪次、決策回合與時間窗中的動態變化，使用自相關、FFT、MFDFA、遞迴分析及事件／狀態分割。"
  categories: ["research"]
- name: 統計與計算建模
  summary: "使用迴歸、無母數檢定、置換程序、分群、降維、強化學習與階層貝氏模型，處理重複測量、雙人與群體資料。"
  categories: ["research"]
- name: 模型驗證與視覺化
  summary: "以 held-out、null、shuffled 與 pseudo-pair 基準，搭配敏感度分析、不確定性估計與診斷；使用 Matplotlib、Seaborn、Plotly 溝通結果。"
  categories: ["programming", "research"]
- name: 研究系統與資料蒐集
  summary: "具 PsychoPy、HTML 實驗、BIOPAC，以及多模態與雙人互動資料流程經驗。"
  categories: ["programming", "research"]
- name: 語言能力
  summary: "中文母語；英文 IELTS 7.5、TOEIC 935，可進行英文研究閱讀、技術溝通與跨國合作。"
  categories: ["language"]
