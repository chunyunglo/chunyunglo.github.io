skills:
- name: 資料處理與分析
  summary: "將原始資料整理為可分析的格式，進行統計檢定、分群與比較分析，並以視覺化呈現結果。常用工具包括 Python（Pandas、scikit-learn、statsmodels）與 Google 試算表。"
  categories: ["programming", "research"]
- name: 資料查證與品質控管
  summary: "在提出結論前，以比較基準、逐筆核對與重複檢查確認資料與分析結果的正確性。"
  categories: ["research"]
- name: 文本與對話分析
  summary: "運用自然語言處理與大型語言模型分析大量文本與對話，包括語意相似度與語意隨時間的變化。"
  categories: ["language", "research"]
- name: AI 工具應用與流程自動化
  summary: "熟悉 Claude、ChatGPT 與 Gemini 於研究、寫作與資料整理上的應用；能串接 LINE、Google 試算表等服務建立自動化流程，並以 AI 程式開發工具建置網站。"
  categories: ["programming"]
- name: 實驗設計與資料蒐集
  summary: "具實驗設計與執行、參與者招募與排程經驗；熟悉 PsychoPy、網頁實驗、BIOPAC 生理訊號紀錄與虛擬實境實驗。"
  categories: ["research"]
- name: 溝通與語言能力
  summary: "中文母語；英文 IELTS 7.5、TOEIC 935。具學術研討會口頭與海報發表經驗，並曾於海外研究機構以英文進行協作。"
  categories: ["language"]
