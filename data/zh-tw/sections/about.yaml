summary: 我是國立臺灣大學心理學系四年級學生，並於實驗室擔任研究助理。我擅長將研究問題拆解為可分析的步驟，蒐集並整理合適的資料，經過嚴謹查證後進行分析，並以清楚的方式呈現結論；研究經驗涵蓋對話互動、群體決策與跨語言語意等主題。此外，我也運用 AI 工具將重複性工作建立為自動化流程。
interests: 我擅長將問題拆解為可分析的步驟，經過嚴謹查證後提出結論，研究經驗涵蓋對話互動、群體決策與跨語言語意；同時也運用 AI 工具建立自動化工作流程。
