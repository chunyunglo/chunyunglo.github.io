projects:
- name: 共享觀影與回憶的語意結構
  role: 國科會大專學生研究計畫
  timeline: "2026 - 至今"
  summary: "探討共同觀看自然情境影片如何影響自由回憶的語意結構；以大型語言模型與語意表徵分析共享經驗。"
  tags: ["language", "methods", "LLM", "semantic analysis"]
- name: 以詞語聯想估計翻譯詞的語意等價
  role: 研究實習專案，與 Simon De Deyne 合作
  timeline: "2026"
  summary: "只用中英文自由聯想常模，估計一個英文詞與其中文翻譯的語意有多接近；以雙語詞典作為連接兩個語言的兩座橋。方法先在一半的人類評分上開發並固定，再於另一半上只評分一次。公開 demo 以合成資料跑完整個流程。"
  repo: "https://github.com/chunyunglo/two-bridges-demo"
  tags: ["language", "methods", "word associations", "cross-lingual semantics"]
- name: 共享經驗中的語意收斂
  role: 研究分析與口頭發表
  timeline: "2025"
  summary: "分析共同經驗後的對話，探討人們如何在互動中逐步建立共同理解，並以自然語言與時間序列方法描繪其動態歷程。"
  tags: ["language", "methods", "interaction", "time series"]
- name: 權力轉換下的行為策略
  role: 計算建模與研討會發表
  timeline: "2026"
  summary: "以多回合公共財與獨裁者賽局探討權力狀態改變時的資源分配行為；使用分群與強化學習建模策略差異。"
  tags: ["decision", "methods", "reinforcement learning", "clustering"]
