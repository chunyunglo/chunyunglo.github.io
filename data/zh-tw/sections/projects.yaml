projects:
- name: 行為解碼 Behavior Decoded：AI 自動經營的科普頻道
  role: 社群媒體自動化
  timeline: "2026 - 至今"
  highlight: 從選題、製作、查核到發布與經營，全程由 AI 自動完成
  problem: "計算社會科學與行為研究的新論文很多，但多數停留在學術圈，一般大眾不容易接觸；若以人工持續經營科普頻道，選題、撰稿、剪輯與發布都需要大量時間。"
  approach: "每天自動從 arXiv 與期刊挑選一篇以計算方法研究人類行為的新論文，由 Claude 閱讀全文並撰寫中英文腳本，再自動配音、生成畫面並輸出直式短影音，發布到 YouTube Shorts、Instagram Reels 與 Threads。上片前由另一個 Claude 逐句對照論文查核內容，並抽取畫面檢查字幕與數字，任何一關未通過就不發布。"
  result: "頻道每日自動更新；系統也會自動回覆留言、讀取後台數據，並每週依成效調整選題與經營策略。"
  links:
  - name: YouTube
    url: "https://www.youtube.com/@Human-_-Behavior-_-Decode"
  - name: Instagram
    url: "https://www.instagram.com/human__behavior__decode/"
  repo: "https://github.com/chunyunglo/paper-shorts"
  tags: ["tools", "Claude", "社群媒體", "影片自動生成"]
- name: 實驗參與者提醒系統
  role: LINE bot 流程自動化
  timeline: "2025 - 至今"
  highlight: 將人工通知流程轉為自動化作業
  problem: "實驗前需逐一聯繫參與者並確認出席，人工作業耗時，且在參與者人數增加時容易產生疏漏。"
  approach: "串接 LINE、Google 試算表與 Gmail：參與者加入 LINE 好友後，系統自動對應其報名資料，並依實驗排程在實驗前自動發送提醒；僅在出現例外狀況時寄信通知負責人員。"
  result: "提醒流程不再需要人工逐筆處理；新增實驗時只需在設定表加入一列，無須修改程式。"
  tags: ["tools", "LINE", "Google 試算表", "流程自動化"]
- name: 個人網站與內容編輯器
  role: 獨立建置與維護
  timeline: "2025 - 至今"
  highlight: 運用 AI 程式開發工具獨立完成建置
  problem: "需要一個整合經歷、文章與相簿的中英雙語網站，並能在不修改程式碼的情況下持續更新內容。"
  approach: "以 AI 程式開發工具建置本網站，並另外開發內容編輯器，支援撰寫文章與上傳相簿。"
  result: "網站持續維護中，文章與相簿皆透過此編輯器發布。"
  repo: "https://github.com/chunyunglo/chunyunglo.github.io"
  tags: ["tools", "網站開發", "AI 程式開發"]
- name: 以詞語聯想估計翻譯詞的語意等價
  role: 研究實習專案，與 Simon De Deyne 合作
  timeline: "2026"
  highlight: 公開 demo 以合成資料示範完整分析流程
  problem: "如何在不依賴平行語料的情況下，估計一個英文詞與其中文翻譯在語意上的接近程度？"
  approach: "僅使用中英文自由聯想常模，並以雙語詞典作為連接兩種語言的橋梁。方法先於一半的人類評分資料上開發並固定，再於另一半資料上進行單次評估，以避免過度配適。"
  result: "公開 demo 以合成資料完整呈現分析流程。"
  repo: "https://github.com/chunyunglo/two-bridges-demo"
  tags: ["research", "跨語言語意", "詞語聯想"]
- name: 共享觀影與回憶的語意結構
  role: 國科會大專學生研究計畫
  timeline: "2026 - 至今"
  highlight: 國科會大專學生研究計畫
  problem: "共同觀看自然情境影片的經驗，是否會影響個體事後自由回憶的語意結構？"
  approach: "運用大型語言模型與語意表徵方法，分析共享經驗對回憶內容的影響。"
  tags: ["research", "大型語言模型", "語意分析"]
- name: 共享經驗中的語意收斂
  role: 第一作者
  timeline: "2025"
  highlight: 2025 臺灣心理學會年會口頭發表
  problem: "人們在共同經歷一件事之後，如何透過對話逐步建立共同理解？"
  approach: "結合自然語言處理與時間序列方法，描繪對話過程中語意變化的動態歷程。"
  tags: ["research", "對話分析", "時間序列"]
- name: 權力轉換下的資源分配策略
  role: 第一作者
  timeline: "2026"
  highlight: 2026 臺灣心理學會年會海報發表
  problem: "當權力逐步趨於平等時，原本有權與無權的個體會如何調整資源分配行為？"
  approach: "以多回合公共財與獨裁者賽局資料，運用分群與計算模型刻畫不同的分配策略。"
  tags: ["research", "決策行為", "計算建模"]
