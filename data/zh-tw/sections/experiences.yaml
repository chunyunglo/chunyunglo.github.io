experiences:
- company:
    name: 計算互動心智科學實驗室（CHEN Lab）
    url: "https://www.chenlaboratory.com"
    location: 台北，臺灣
    logo: /images/sections/experiences/company1.jpg
    overview: 國立臺灣大學心理學系之計算互動心智科學實驗室。
  positions:
  - designation: 兼任學生研究助理
    start: 2025
    responsibilities:
    - 建立自然語言、序列行為、時間序列與多模態人類資料的 Python 分析流程。
    - 從語音與互動觀測資料建構語意、語法、時間及行為特徵，並協助資料對齊與視覺化。
    - 應用主題建模、分群、事件分割、強化學習及階層貝氏模型，分析共享經驗與決策行為。
    - 執行雙人互動與虛擬實境實驗；使用 BIOPAC 與頭戴式攝影機蒐集生理及行為資料。
    - 以明確基準、held-out 比較、置換與敏感度程序、不確定性估計及模型診斷評估結果。
- company:
    name: Complex Human Data Hub
    location: 墨爾本，澳洲
    logo: /images/sections/experiences/company2.jpg
    overview: 跨領域人類資料研究中心。
  positions:
  - designation: 研究實習生
    start: 2026
    end: 2026
    responsibilities:
    - 以中英文詞語聯想資料庫建構語意向量空間。
    - 應用分佈語義學方法，評估翻譯詞對的跨語言語意對齊。
