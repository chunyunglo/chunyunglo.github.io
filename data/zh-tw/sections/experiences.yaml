section:
  name: 經歷
  id: experiences
  enable: true
  weight: 3
  showOnNavbar: true

experiences:
- company:
    name: 計算互動心智科學實驗室（CHEN Lab）
    url: "https://www.chenlaboratory.com"
    location: 台北，臺灣
    logo: /images/sections/experiences/chen-lab.png
    overview: 國立臺灣大學心理學系之計算互動心智科學實驗室。
  positions:
  - designation: 兼任學生研究助理
    start: 2025
    responsibilities:
    - 以 Python 建立對話、決策與實驗資料的分析流程，涵蓋資料清理、統計分析與視覺化。
    - 以第一作者身分於臺灣心理學會年會進行口頭發表（2025）與海報發表（2026），並參與多項合作發表。
    - 執行雙人互動與虛擬實境實驗，負責參與者排程與追蹤，並將提醒流程自動化。
    - 以比較基準與重複檢核驗證分析結果，確保結論的可靠性。
- company:
    name: Complex Human Data Hub
    location: 墨爾本，澳洲
    logo: /images/sections/experiences/complex-human-data-hub.png
    overview: 跨領域人類資料研究中心。
  positions:
  - designation: 研究實習生
    start: 2026
    end: 2026
    responsibilities:
    - 於交換期間主動爭取之研究實習，全程以英文與國際團隊協作。
    - 以中英文詞語聯想資料，發展估計翻譯詞語意等價程度的方法。
    - 公開以合成資料示範完整分析流程的 [demo](https://github.com/chunyunglo/two-bridges-demo)。
- company:
    name: 國立臺灣大學心理學系系學會
    location: 台北，臺灣
    logo: /images/sections/education/ntulogo.png
    overview: 學生自治組織，規劃學術活動與系務交流。
  positions:
  - designation: 學術部部長
    start: 2023
    end: 2025
    responsibilities:
    - 規劃並帶領系上學術活動，促進學生與學者、實務工作者的交流。
    - 擔任「與癌同行」及「與鄧依涵導演有約」活動的核心籌辦人員。
    - 參與 2023 年杜鵑花節影片團隊，並於 2024 年擔任團隊帶領者。
- company:
    name: EdYouth 臺灣一滴優教育協會
    url: "https://www.edyouth.org/"
    location: 台北，臺灣
    logo: /images/sections/experiences/edyouth.png
    overview: 由學生推動教育倡議與培力行動的非營利組織。
  positions:
  - designation: 育才推廣組組員
    start: 2023
    end: 2024
    responsibilities:
    - 規劃並執行學習歷程檔案、壓力調適與成長心態相關工作坊。
    - 協助籌辦暑期系列講座，提供學生學習與升學資訊。
    - 參與教育倡議行動，從學生視角整理並傳達教育現場需求。
