experiences:
- company:
    name: Computational Human-sociocultural Experimental Neuroscience Lab (CHEN Lab)
    url: "https://www.chenlaboratory.com"
    location: Taipei, Taiwan
    logo: /images/sections/experiences/chen-lab.png
    overview: Computational interactive-mind research lab in the Department of Psychology at National Taiwan University.
  positions:
  - designation: Undergraduate Research Assistant
    start: 2025
    responsibilities:
    - Develop Python workflows for natural-language, sequential-behavior, time-series, and multimodal human data.
    - Engineer semantic, syntactic, temporal, and behavioral features from speech and interaction observations; support data alignment and visualization.
    - Apply topic modeling, clustering, event segmentation, reinforcement learning, and hierarchical Bayesian modeling to shared-experience and decision-behavior research.
    - Run dyadic interaction and virtual-reality studies; collect physiological and behavioral data with BIOPAC and head-mounted cameras.
    - Evaluate analyses using explicit baselines, held-out comparisons, permutation and sensitivity procedures, uncertainty estimates, and diagnostic checks.
- company:
    name: Complex Human Data Hub
    location: Melbourne, Australia
    logo: /images/sections/experiences/complex-human-data-hub.png
    overview: An interdisciplinary research hub for complex human data.
  positions:
  - designation: Research Intern
    start: 2026
    end: 2026
    responsibilities:
    - Constructed Chinese and English semantic vector spaces from word-association databases.
    - Applied distributional-semantic methods to evaluate cross-lingual alignment between translation pairs.
