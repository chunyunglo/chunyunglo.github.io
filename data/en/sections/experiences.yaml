  positions:
  - designation: Research Intern
    start: 2026
    end: 2026
    responsibilities:
    - Constructed Chinese and English semantic vector spaces from word-association databases.
    - Applied distributional-semantic methods to evaluate cross-lingual alignment between translation pairs.
