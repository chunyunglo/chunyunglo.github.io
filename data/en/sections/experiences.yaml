experiences:
- company:
    name: Computational Human-sociocultural Experimental Neuroscience Lab (CHEN Lab)
    url: "https://www.chenlaboratory.com"
    location: Taipei, Taiwan
    logo: /images/sections/experiences/chen-lab.png
    overview: Computational interactive-mind research lab in the Department of Psychology at National Taiwan University.
  positions:
  - designation: Undergraduate Research Assistant
    start: 2025
    responsibilities:
    - Build Python analysis pipelines for conversational, decision-making, and experimental data, covering data cleaning, statistical analysis, and visualization.
    - Presented two studies as first author at the Taiwanese Psychological Association annual meetings and contributed to several co-authored presentations.
    - Conduct dyadic interaction and virtual-reality experiments, manage participant scheduling and follow-up, and automated the reminder workflow.
    - Validate findings against explicit baselines and repeated checks to ensure reliable conclusions.
- company:
    name: Complex Human Data Hub
    location: Melbourne, Australia
    logo: /images/sections/experiences/complex-human-data-hub.png
    overview: An interdisciplinary research hub for complex human data.
  positions:
  - designation: Research Intern
    start: 2026
    end: 2026
    responsibilities:
    - Independently secured this research internship during my exchange and collaborated with an international team entirely in English.
    - Developed a method for estimating translation equivalence from Chinese and English word-association data.
    - Released a [public demo](https://github.com/chunyunglo/two-bridges-demo) that runs the full pipeline on synthetic data.
