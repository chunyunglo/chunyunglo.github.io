projects:
- name: Shared Viewing and Semantic Structure in Memory
  role: NSTC Undergraduate Research Project
  timeline: "2026 - Present"
  summary: "Investigates how watching naturalistic video together shapes the semantic structure of free recall, using large-language-model and semantic-representation analyses of shared experience."
  tags: ["language", "methods", "LLM", "semantic analysis"]
- name: Semantic Convergence in Shared Experience
  role: Research analysis and oral presentation
  timeline: "2025"
  summary: "Analyzed post-experience conversation to examine how people progressively establish common understanding, using natural-language and time-series approaches to characterize the dynamics."
  tags: ["language", "methods", "interaction", "time series"]
- name: Behavioral Strategies Under Changing Power
  role: Computational modeling and conference presentation
  timeline: "2026"
  summary: "Examines resource-allocation behavior as power status changes in multi-round public-goods and dictator games, using clustering and reinforcement-learning models to characterize strategy differences."
  tags: ["decision", "methods", "reinforcement learning", "clustering"]
