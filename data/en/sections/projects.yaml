# problem / approach / result are shown as labeled rows; highlight is the one-line takeaway.
# Keep lab work at the level already public: no unpublished data, numbers, findings or internal details.
projects:
- name: "Behavior Decoded: An AI-Run Science Channel"
  role: Social media automation
  timeline: "2026 - present"
  highlight: Paper selection, production, fact-checking, publishing, and channel management are fully automated
  problem: "New computational research on human behavior rarely reaches the public, and running a science channel by hand requires substantial time for selecting papers, writing scripts, editing, and publishing."
  approach: "Each day the system selects a new paper on computational studies of human behavior from arXiv and journal feeds. Claude reads the full text and writes Chinese and English scripts, which are then voiced, animated, and rendered as vertical short videos for YouTube Shorts, Instagram Reels, and Threads. Before publishing, a second Claude pass checks every line against the paper and sampled frames are reviewed for errors; if any check fails, nothing is posted."
  result: "The channel updates daily. The system also replies to comments, reads channel analytics, and adjusts its topic selection and strategy every week based on performance."
  links:
  - name: YouTube
    url: "https://www.youtube.com/@Human-_-Behavior-_-Decode"
  - name: Instagram
    url: "https://www.instagram.com/human__behavior__decode/"
  repo: "https://github.com/chunyunglo/paper-shorts"
  tags: ["tools", "Claude", "social media", "automated video"]
- name: Participant Reminder System
  role: LINE bot workflow automation
  timeline: "2025 - present"
  highlight: Converted a manual notification process into an automated workflow
  problem: "Contacting each participant before a session and confirming attendance by hand was time-consuming and became error-prone as studies grew."
  approach: "Integrated LINE, Google Sheets, and Gmail: when participants add the LINE account, the system matches them to their sign-up records and sends reminders according to the study schedule, emailing staff only when an exception requires attention."
  result: "Reminders no longer require manual handling, and a new study is added with a single row in a settings sheet, with no code changes."
  tags: ["tools", "LINE", "Google Sheets", "workflow automation"]
- name: Personal Website and Content Editor
  role: Independently built and maintained
  timeline: "2025 - present"
  highlight: Built independently with AI-assisted development tools
  problem: "Needed a bilingual site combining experience, writing, and photo albums that could be updated without editing code."
  approach: "Built this site with AI-assisted development tools and developed a companion editor for writing posts and uploading albums."
  result: "The site is actively maintained, with all posts and albums published through the editor."
  repo: "https://github.com/chunyunglo/chunyunglo.github.io"
  tags: ["tools", "web development", "AI-assisted development"]
- name: Estimating Translation Equivalence from Word Associations
  role: Research internship project, with Simon De Deyne
  timeline: "2026"
  highlight: Public demo presents the full pipeline on synthetic data
  problem: "How can the semantic closeness between an English word and its Chinese translation be estimated without parallel corpora?"
  approach: "Uses only Chinese and English free-association norms, with bilingual dictionaries bridging the two languages. The method was developed and frozen on half of the human ratings, then evaluated once on the other half to avoid overfitting."
  result: "A public demo presents the complete pipeline on synthetic data."
  repo: "https://github.com/chunyunglo/two-bridges-demo"
  tags: ["research", "cross-lingual semantics", "word associations"]
- name: Shared Viewing and Semantic Structure in Memory
  role: NSTC Undergraduate Research Project
  timeline: "2026 - present"
  highlight: NSTC undergraduate research project
  problem: "Does watching naturalistic films together shape the semantic structure of later free recall?"
  approach: "Applies large language models and semantic representations to examine how shared experience influences recall."
  tags: ["research", "large language models", "semantic analysis"]
- name: Semantic Convergence in Shared Experience
  role: First author
  timeline: "2025"
  highlight: Oral presentation, Taiwanese Psychological Association 2025
  problem: "How do people build common understanding through conversation after a shared experience?"
  approach: "Combines natural language processing and time-series methods to characterize how meaning evolves over a conversation."
  tags: ["research", "conversation analysis", "time series"]
- name: Resource Allocation Strategies under Shifting Power
  role: First author
  timeline: "2026"
  highlight: Poster, Taiwanese Psychological Association 2026
  problem: "As power becomes equal, how do previously powerful and powerless individuals adjust their allocation behavior?"
  approach: "Uses multi-round public goods and dictator game data, applying clustering and computational models to characterize distinct allocation strategies."
  tags: ["research", "decision-making", "computational modeling"]
