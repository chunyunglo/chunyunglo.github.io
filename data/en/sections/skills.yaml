skills:
- name: Data Processing & Analysis
  summary: "Prepare raw data for analysis, conduct statistical testing, clustering, and comparative analyses, and present results through visualization. Tools include Python (Pandas, scikit-learn, statsmodels) and Google Sheets."
  categories: ["programming", "research"]
- name: Verification & Quality Control
  summary: "Confirm the accuracy of data and results through baselines, record-level checks, and repeated verification before drawing conclusions."
  categories: ["research"]
- name: Text & Conversation Analysis
  summary: "Analyze large volumes of text and conversation with natural language processing and large language models, including semantic similarity and change over time."
  categories: ["language", "research"]
- name: Applied AI & Workflow Automation
  summary: "Experienced in applying Claude, ChatGPT, and Gemini to research, writing, and data organization; integrate services such as LINE and Google Sheets into automated workflows; build websites with AI-assisted development tools."
  categories: ["programming"]
- name: Experimental Design & Data Collection
  summary: "Experienced in designing and running experiments and recruiting and scheduling participants; familiar with PsychoPy, web-based experiments, BIOPAC physiological recording, and virtual reality."
  categories: ["research"]
- name: Communication & Languages
  summary: "Native Mandarin; English IELTS 7.5, TOEIC 935. Experienced in oral and poster presentations at academic conferences and in English-language collaboration at an overseas research institution."
  categories: ["language"]
