# Local editor for the whole site (posts, albums, profile sections). Start it with `npm run write` (see README).
backend:
  name: github
  repo: chunyunglo/chunyunglo.github.io
  branch: main
local_backend: true
locale: zh_Hant
site_url: http://localhost:1313
display_url: https://chunyunglo.github.io

# Images picked in the profile sections (logos, profile photo) go here; posts and albums keep theirs next to the text.
media_folder: assets/images/uploads
public_folder: /images/uploads

collections:
- name: blog
  label: 文章（中文）
  label_singular: 文章
  folder: content/blog
  create: true
  path: '{{fields.slug}}/index'
  slug: '{{fields.slug}}'
  filter:
    field: lang
    value: zh
  media_folder: ''
  public_folder: ''
  preview_path: blog/{{fields.slug}}/
  summary: '{{title}}（{{year}}-{{month}}-{{day}}）{{draft}}'
  sortable_fields:
  - date
  - title
  view_filters:
  - label: 草稿
    field: draft
    pattern: true
  fields:
  - name: title
    label: 標題
    widget: string
  - name: slug
    label: 網址代稱（英文小寫與連字號，例如 my-first-post）
    widget: string
    pattern:
    - ^[a-z0-9]+(?:-[a-z0-9]+)*$
    - 只能用英文小寫、數字與連字號
  - name: lang
    label: 語言
    widget: hidden
    default: zh
  - name: date
    label: 日期
    widget: datetime
    format: YYYY-MM-DDTHH:mm:ssZ
  - name: draft
    label: 草稿（勾選時不會發布）
    widget: boolean
    default: true
    required: false
  - name: description
    label: 摘要（顯示在文章列表與搜尋結果）
    widget: text
    required: false
  - name: tags
    label: 標籤
    widget: list
    required: false
  - name: series
    label: 系列代稱（同一系列的文章填一樣的，例如 monash-2026；沒有就留空）
    widget: string
    required: false
  - name: cover
    label: 封面圖片
    widget: image
    required: false
    choose_url: false
  - name: coverAlt
    label: 封面圖片說明
    widget: string
    required: false
  - name: body
    label: 內文
    widget: markdown
- name: blog_en
  label: Posts (English)
  label_singular: Post
  folder: content/blog
  create: true
  extension: en.md
  format: frontmatter
  path: '{{fields.slug}}/index'
  slug: '{{fields.slug}}'
  filter:
    field: lang
    value: en
  media_folder: ''
  public_folder: ''
  summary: '{{title}} ({{year}}-{{month}}-{{day}})'
  fields:
  - name: title
    label: Title
    widget: string
  - name: slug
    label: Folder name (use the same as the Chinese post to link them)
    widget: string
    pattern:
    - ^[a-z0-9]+(?:-[a-z0-9]+)*$
    - lowercase letters, digits and hyphens only
  - name: lang
    label: Language
    widget: hidden
    default: en
  - name: date
    label: Date
    widget: datetime
    format: YYYY-MM-DDTHH:mm:ssZ
  - name: draft
    label: Draft
    widget: boolean
    default: true
    required: false
  - name: description
    label: Summary
    widget: text
    required: false
  - name: tags
    label: Tags
    widget: list
    required: false
  - name: series
    label: Series (same value for every post in a series; leave empty if none)
    widget: string
    required: false
  - name: cover
    label: Cover image
    widget: image
    required: false
    choose_url: false
  - name: coverAlt
    label: Cover alt text
    widget: string
    required: false
  - name: body
    label: Body
    widget: markdown
- name: album
  label: 相簿
  label_singular: 相簿
  folder: content/album
  create: true
  path: '{{fields.slug}}/index'
  slug: '{{fields.slug}}'
  filter:
    field: lang
    value: zh
  media_folder: ''
  public_folder: ''
  preview_path: album/{{fields.slug}}/
  summary: '{{title}}（{{year}}-{{month}}）'
  sortable_fields:
  - date
  - title
  fields:
  - name: title
    label: 相簿名稱
    widget: string
  - name: slug
    label: 網址代稱（英文小寫與連字號，例如 tokyo-2027）
    widget: string
    pattern:
    - ^[a-z0-9]+(?:-[a-z0-9]+)*$
    - 只能用英文小寫、數字與連字號
  - name: lang
    label: 語言
    widget: hidden
    default: zh
  - name: date
    label: 日期（拍攝時間，用來排序）
    widget: datetime
    format: YYYY-MM-DDTHH:mm:ssZ
  - name: draft
    label: 草稿（勾選時不會出現在網站）
    widget: boolean
    default: false
    required: false
  - name: location
    label: 地點（例如：東京，日本）
    widget: string
    required: false
  - name: description
    label: 一句話介紹
    widget: text
    required: false
  - name: cover
    label: 封面照片（沒選就用第一張）
    widget: image
    choose_url: false
    required: false
  - name: photos
    label: 照片（可拖曳排序）
    widget: list
    fields:
    - name: image
      label: 照片
      widget: image
      choose_url: false
    - name: caption
      label: 說明
      widget: string
      required: false
    summary: '{{fields.caption}}'
  - name: body
    label: 相簿文字（選填）
    widget: markdown
    required: false
