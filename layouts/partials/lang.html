{{- /* Language metadata by key; avoids Language fields that differ between Hugo versions. */ -}}
{{- $m := dict
  "zh-tw" (dict "code" "zh-Hant-TW" "og" "zh_TW" "label" "中文")
  "en" (dict "code" "en" "og" "en_US" "label" "EN")
-}}
{{- return index $m . | default (dict "code" . "og" . "label" .) -}}
