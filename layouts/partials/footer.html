{{- $data := partial "data.html" . -}}
<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>{{ $data.site.copyright }}</p>
    <ul class="social">
      <li><a href="https://github.com/{{ site.Params.github }}" aria-label="GitHub" rel="me">{{ partial "icon.html" "github" }}</a></li>
      <li><a href="https://www.linkedin.com/in/{{ site.Params.linkedin }}/" aria-label="LinkedIn" rel="me">{{ partial "icon.html" "linkedin" }}</a></li>
    </ul>
  </div>
</footer>
